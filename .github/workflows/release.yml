name: release

# Tag a release to publish it:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Publishing uses PyPI Trusted Publishing, so there is no token to store: PyPI
# verifies this workflow's OIDC identity instead. Register the publisher once at
# https://pypi.org/manage/project/pytest-skillcheck/settings/publishing/ with owner
# wiltaylor, repository pytest-skillcheck, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
