[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillrig"
version = "0.1.2"
description = "Test agent skills against real coding agents: run a prompt, assert on what happened, grade the rest with an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wil Taylor", email = "ai@wiltaylor.dev" }]
keywords = ["agent", "skills", "claude", "codex", "opencode", "pytest", "eval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/wiltaylor/skillrig"
Issues = "https://github.com/wiltaylor/skillrig/issues"

[project.scripts]
skillrig = "skillrig.cli:main_cli"

[project.entry-points.pytest11]
skillrig = "skillrig.plugin"

[dependency-groups]
dev = ["pytest>=8", "pytest-subprocess>=1.5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/skillrig"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
